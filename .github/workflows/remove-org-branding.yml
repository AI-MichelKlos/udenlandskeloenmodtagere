name: Fjern organisationsnavn fra dashboard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-org-branding.yml

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fjern synlig organisationsbranding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          target = "Danske " + "A-kasser"
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          replacements = {
              target + " | Arbejdsmarked": "Arbejdsmarked",
              "Beregning: " + target + ".": "Beregning: Michel Klos.",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if target in text:
              raise RuntimeError("Organisationsnavnet findes stadig i index.html")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Gem ændringen
        shell: bash
        run: |
          git config user.name "Dashboard maintenance"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add index.html
          git commit -m "Fjern organisationsnavn fra dashboard"
          git push origin HEAD:main