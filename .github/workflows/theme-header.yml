name: Kontrollér redaktionelt topdesign
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/editorial-design.css"
      - ".github/workflows/theme-header.yml"
permissions:
  contents: read
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kontrollér at den gamle brune header ikke genindføres
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("assets/editorial-design.css").read_text(encoding="utf-8")
          assert "assets/editorial-design.css" in html, "Nyt design mangler"
          assert 'id="dak-header-theme"' not in html, "Gammel brun header er tilbage"
          assert "body > header::before" in css, "Beskyttelse mod gammel baggrund mangler"
          assert 'url("./editorial-wave.svg")' in css, "Ny blå bølgebaggrund mangler"
          print("OK: Redaktionelt topdesign er aktivt uden legacy-brunt banner")
          PY
