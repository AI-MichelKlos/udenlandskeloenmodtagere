name: Engangsopdatering af dashboarddesign

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/streamline-visual-design.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Strømlin design og byline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text
          replacements = {
              'header { background: var(--heading); color: white; padding: 38px 24px 34px; }': 'header { background: linear-gradient(135deg,#0F2B36,#244d4b); color: white; padding: 32px 20px; }',
              '.wrap { max-width: 1240px; margin: 0 auto; }': '.wrap { max-width: 1280px; margin: 0 auto; }',
              '.lead { margin: 14px 0 0; max-width: 820px; color: #dbe7e0; font-size: 1.05rem; }': '.byline { margin: 6px 0 0; font-size: .78rem; color: #c9d8d5; font-weight: 600; }\n    .lead { margin: 10px 0 0; max-width: 900px; color: #e7eeee; font-size: 1.05rem; }',
              'main { padding: 24px; }': 'main { padding: 28px 20px 55px; }',
              'max-width: 1240px; padding: 14px 16px;': 'max-width: 1280px; padding: 14px 16px;',
              'border-radius: 15px; padding: 18px; box-shadow: var(--shadow);': 'border-radius: 12px; padding: 18px; box-shadow: var(--shadow);',
              'border-radius: 17px; padding: 22px; box-shadow: var(--shadow);': 'border-radius: 12px; padding: 22px; box-shadow: var(--shadow);',
              'border-radius: 15px; padding: 18px 20px;': 'border-radius: 12px; padding: 18px 20px;',
              '--shadow: 0 10px 26px rgba(15, 43, 54, .07);': '--shadow: 0 8px 28px rgba(15, 43, 54, .06);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f'Manglende designanker: {old[:80]}')
              text = text.replace(old, new, 1)
          old_head = '<header><div class="wrap"><p class="eyebrow">Danske A-kasser | Arbejdsmarked</p><h1>Udenlandske lønmodtagere i Danmark</h1><p class="lead">'
          new_head = '<header><div class="wrap"><p class="eyebrow">Danske A-kasser | Arbejdsmarked</p><h1>Udenlandske lønmodtagere i Danmark</h1><div class="byline">Udarbejdet af Michel Klos@GitHub</div><p class="lead">'
          if old_head not in text:
              raise RuntimeError('Kunne ikke finde dashboardets nuværende top')
          text = text.replace(old_head, new_head, 1)
          if text == original or 'Udarbejdet af Michel Klos@GitHub' not in text or 'linear-gradient(135deg,#0F2B36,#244d4b)' not in text:
              raise RuntimeError('Designændringen blev ikke anvendt')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Kontroller ændringen
        shell: bash
        run: |
          grep -Fq 'Udarbejdet af Michel Klos@GitHub' index.html
          grep -Fq 'linear-gradient(135deg,#0F2B36,#244d4b)' index.html
          grep -Fq 'data/dashboard-data.json' index.html
          grep -Fq 'const COLORS=' index.html
      - name: Gem ændringen og fjern engangsworkflow
        shell: bash
        run: |
          rm .github/workflows/streamline-visual-design.yml
          git config user.name "ChatGPT design update"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add index.html .github/workflows/streamline-visual-design.yml
          git commit -m "Strømlin dashboarddesign og tilføj byline"
          git push origin HEAD:main
